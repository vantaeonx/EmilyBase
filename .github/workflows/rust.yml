name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Format fuzz targets
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Independent synthetic cryptographic vectors
        run: |
          password_oracle_dir=$(mktemp -d)
          trap 'rm -rf "$password_oracle_dir"' EXIT
          python3 -m venv "$password_oracle_dir/venv"
          "$password_oracle_dir/venv/bin/python" -m pip install argon2-cffi==25.1.0 ruff==0.16.10
          "$password_oracle_dir/venv/bin/ruff" format --check tests/password_oracle.py
          "$password_oracle_dir/venv/bin/ruff" check tests/password_oracle.py
          "$password_oracle_dir/venv/bin/python" tests/password_oracle.py --output "$password_oracle_dir/vectors.json"
          cmp docs/measurements/2026-10-07-password-verifiers/oracle-vectors.json "$password_oracle_dir/vectors.json"
          "$password_oracle_dir/venv/bin/ruff" format --check tests/session_token_oracle.py
          "$password_oracle_dir/venv/bin/ruff" check tests/session_token_oracle.py
          python3 tests/session_token_oracle.py --output "$password_oracle_dir/tokens.json"
          cmp docs/measurements/2026-10-07-session-tokens/oracle-vectors.json "$password_oracle_dir/tokens.json"
      - name: Build
        run: cargo build --locked --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install SDK tooling
        run: npm ci --ignore-scripts --prefix sdks/typescript
      - name: SDK format and strict compilation/unit tests
        run: |
          npm run format:check --prefix sdks/typescript
          npm test --prefix sdks/typescript
      - name: SDK against real server and restart
        run: npm run test:integration --prefix sdks/typescript
      - name: Lint and compile fuzz targets
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --bins -- -D warnings
  msrv:
    name: Minimum Rust 1.89
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Test workspace on minimum Rust
        run: cargo +1.89.0 test --locked --workspace
  advisories:
    name: Known dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned auditor
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Check workspace lockfile
        run: cargo +stable audit --deny warnings
      - name: Check fuzz lockfile against the same database
        run: cargo +stable audit --no-fetch --file fuzz/Cargo.lock --deny warnings
  profiles:
    name: Synthetic allocation diagnostics
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install profile toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install 1.89.0 --profile minimal
      - name: Strict opt-in diagnostics checks
        run: cargo clippy --locked -p emilybase-model-profile --all-targets --features heap-profile -- -D warnings
      - name: Real release diagnostic processes and report admission
        # Allocation samples observe the process allocator, including libtest.
        # A sequential runner prevents unrelated harness allocations entering them.
        run: cargo test --release --locked -p emilybase-model-profile --features heap-profile -- --test-threads=1
      - name: Minimum Rust diagnostic compatibility
        run: cargo +1.89.0 check --locked -p emilybase-model-profile --all-targets --features heap-profile
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install SDK tooling
        run: npm ci --ignore-scripts --prefix sdks/typescript
      - name: Compile SDK
        run: npm run build --prefix sdks/typescript
      - name: Check container probe
        run: |
          python3 -m pip install ruff==0.16.10
          ruff format --check tests/containers.py
          ruff check tests/containers.py
      - name: Original server container, restart, kill, corruption and restore
        run: python3 tests/containers.py --sdk
