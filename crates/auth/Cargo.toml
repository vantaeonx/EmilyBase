[package]
name = "emilybase-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9", features = ["alloc"] }
emilybase-catalog = { path = "../catalog" }
emilybase-database = { path = "../database" }
emilybase-transactions = { path = "../transactions" }
emilybase-backup = { path = "../backup" }

[dev-dependencies]
serde_json = "1"
proptest = "1"
tempfile = "3"

[lints]
workspace = true
