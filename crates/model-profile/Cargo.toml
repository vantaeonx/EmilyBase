[package]
name = "emilybase-model-profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
heap-profile = ["dep:dhat", "dep:emilybase-auth"]

[[bin]]
name = "emilybase-model-profile"
path = "src/main.rs"
required-features = ["heap-profile"]
test = false
bench = false

[[bin]]
name = "emilybase-schema-allocation-check"
path = "src/schema_allocation.rs"
required-features = ["heap-profile"]
test = false
bench = false

[[bin]]
name = "emilybase-token-allocation-check"
path = "src/token_allocation.rs"
required-features = ["heap-profile"]
test = false
bench = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
dhat = { version = "=0.3.3", optional = true }
emilybase-auth = { path = "../auth", optional = true }
emilybase-catalog = { path = "../catalog" }
emilybase-database = { path = "../database" }
emilybase-commit-model = { path = "../commit-model" }
emilybase-commit-format = { path = "../commit-format" }
emilybase-index = { path = "../index" }

[dev-dependencies]
emilybase-query = { path = "../query" }
proptest = "1"

[lints]
workspace = true
