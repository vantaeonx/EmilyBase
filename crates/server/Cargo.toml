[package]
name = "emilybase-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
emilybase-auth = { path = "../auth" }
emilybase-backup = { path = "../backup" }
emilybase-catalog = { path = "../catalog" }
emilybase-database = { path = "../database" }
emilybase-query = { path = "../query" }
emilybase-transactions = { path = "../transactions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.5"
sha2 = "0.10"
zeroize = { version = "1.9", features = ["alloc"] }
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
emilybase-wal = { path = "../wal" }
proptest = "1"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

[lints]
workspace = true
