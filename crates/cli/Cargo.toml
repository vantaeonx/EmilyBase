[package]
name = "emilybase-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emilybase"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
emilybase-storage = { path = "../storage" }
emilybase-catalog = { path = "../catalog" }
emilybase-database = { path = "../database" }
emilybase-transactions = { path = "../transactions" }
emilybase-backup = { path = "../backup" }
emilybase-query = { path = "../query" }
emilybase-index = { path = "../index" }
emilybase-server = { path = "../server" }
emilybase-auth = { path = "../auth" }
emilybase-transfer = { path = "../transfer" }
emilybase-migrations = { path = "../migrations" }
emilybase-object-storage = { path = "../object-storage" }
emilybase-files = { path = "../files" }
serde = "1"
serde_json = "1"
zeroize = { version = "1.9", features = ["alloc"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
rustix = { version = "1", features = ["pipe"] }

[lints]
workspace = true
