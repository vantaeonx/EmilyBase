[package]
name = "emilybase-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "emilybase"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
emilybase-storage = { path = "../storage" }
emilybase-catalog = { path = "../catalog" }
emilybase-database = { path = "../database" }
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
