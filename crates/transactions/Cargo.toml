[package]
name = "emilybase-transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
emilybase-storage = { path = "../storage" }
emilybase-catalog = { path = "../catalog" }
emilybase-database = { path = "../database" }
emilybase-wal = { path = "../wal" }
emilybase-index = { path = "../index" }
getrandom = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
crc32fast = "1.5"
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
