[package]
name = "emilybase-format-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
crc32fast = "1.5"
sha2 = "0.10"
emilybase-backup = { path = "../crates/backup" }
emilybase-storage = { path = "../crates/storage" }
emilybase-catalog = { path = "../crates/catalog" }
emilybase-database = { path = "../crates/database" }
emilybase-wal = { path = "../crates/wal" }
emilybase-transactions = { path = "../crates/transactions" }

[[bin]]
name = "file_format"
path = "fuzz_targets/file_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_records"
path = "fuzz_targets/catalog_records.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "wal_records"
path = "fuzz_targets/wal_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "managed_recovery"
path = "fuzz_targets/managed_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_archive"
path = "fuzz_targets/backup_archive.rs"
test = false
doc = false
bench = false
