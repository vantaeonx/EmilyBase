[package]
name = "emilybase-format-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
crc32fast = "1.5"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
emilybase-backup = { path = "../crates/backup" }
emilybase-storage = { path = "../crates/storage" }
emilybase-catalog = { path = "../crates/catalog" }
emilybase-database = { path = "../crates/database" }
emilybase-wal = { path = "../crates/wal" }
emilybase-commit-format = { path = "../crates/commit-format" }
emilybase-commit-model = { path = "../crates/commit-model" }
emilybase-transactions = { path = "../crates/transactions" }
emilybase-index = { path = "../crates/index" }
emilybase-query = { path = "../crates/query" }
emilybase-server = { path = "../crates/server" }

[[bin]]
name = "file_format"
path = "fuzz_targets/file_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_records"
